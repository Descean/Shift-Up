<html lang="fr">

<meta charset="UTF-8">

<title>SHIFT UP — Roadmap Site Officiel</title>
<style>
  /* ── Variables couleurs SHIFT UP ── */
  :root {
    --navy:    #0a2533;
    --blue:    #163548;
    --accent:  #1e9fd4;
    --green:   #00d4a0;
    --gold:    #f5c842;
    --orange:  #f97316;
    --gray:    #6d8fa3;
    --bg:      #070f14;
    --surface: #0e1f2b;
    --surface2:#162d3d;
    --text:    #e8f4fc;
    --muted:   #6d8fa3;
    --border:  #1d3a4d;
  }

  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:'Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }

  /* ── En-tête ── */
  header {
    background:linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, #0e2d42 100%);
    padding:28px 40px 24px;
    border-bottom:1px solid var(--border);
  }
  .logo {
    font-size:26px; font-weight:900; letter-spacing:-1px; color:white;
  }
  .logo span { color:var(--accent); }
  header p  { font-size:12px; color:rgba(255,255,255,.55); margin-top:4px; }
  .badge {
    display:inline-block; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2); border-radius:20px;
    padding:3px 12px; font-size:11px; color:rgba(255,255,255,.75);
    margin-top:8px;
  }
  .updated { font-size:11px; color:rgba(255,255,255,.4); margin-top:4px; }

  /* ── Conteneur principal ── */
  .container { max-width:1200px; margin:0 auto; padding:28px 20px; }

  /* ── Barre de progression globale ── */
  .global-progress {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px; padding:22px 28px;
    margin-bottom:24px;
  }
  .global-progress h2 {
    font-size:11px; color:var(--muted); font-weight:700;
    text-transform:uppercase; letter-spacing:2px; margin-bottom:12px;
  }
  .prog-bar-wrap {
    background:var(--surface2); border-radius:99px; height:22px; overflow:hidden;
  }
  .prog-bar-fill {
    height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--green) 100%);
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:10px; transition:width .8s ease;
  }
  .prog-bar-fill span { color:white; font-size:12px; font-weight:800; }
  .prog-stats { display:flex; gap:28px; margin-top:16px; flex-wrap:wrap; }
  .prog-stat .val {
    font-size:24px; font-weight:800;
  }
  .prog-stat .lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

  /* ── Légende ── */
  .legend {
    display:flex; gap:16px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 18px; margin-bottom:20px;
  }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .legend-dot  { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  /* ── Bouton tout ouvrir/fermer ── */
  .toggle-all { text-align:right; margin-bottom:12px; }
  .toggle-all button {
    background:none; border:1.5px solid var(--border); border-radius:8px;
    padding:6px 14px; font-size:11px; color:var(--accent); cursor:pointer;
    font-weight:600; transition:background .2s;
  }
  .toggle-all button:hover { background:var(--surface2); }

  /* ── Cards de phase ── */
  .phases { display:flex; flex-direction:column; gap:14px; }

  .phase-card {
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:14px; overflow:hidden;
    transition:border-color .2s;
  }
  .phase-card:hover { border-color:var(--accent); }

  .phase-header {
    display:flex; align-items:center; gap:14px;
    padding:14px 20px; cursor:pointer;
  }
  .phase-icon { font-size:22px; flex-shrink:0; }
  .phase-meta { flex:1; min-width:0; }
  .phase-meta h3 { font-size:14px; font-weight:800; color:var(--text); }
  .phase-meta p  { font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .status-pill {
    border-radius:99px; padding:4px 12px; font-size:11px;
    font-weight:700; white-space:nowrap; flex-shrink:0;
  }
  .phase-mini-bar {
    width:70px; height:6px; background:var(--surface2);
    border-radius:99px; overflow:hidden; flex-shrink:0;
  }
  .chevron { color:var(--muted); transition:transform .2s; font-size:16px; flex-shrink:0; }
  .phase-card.open .chevron { transform:rotate(180deg); }

  /* ── Corps de phase ── */
  .phase-body { display:none; padding:0 20px 18px; }
  .phase-card.open .phase-body { display:block; }

  /* ── Grille de tâches ── */
  .tasks-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
  }
  @media(max-width:700px) { .tasks-grid { grid-template-columns:1fr; } }

  .task {
    display:flex; align-items:flex-start; gap:10px;
    padding:9px 12px; border-radius:10px; border:1px solid var(--border);
    position:relative; background:var(--surface2);
  }
  .task-icon { font-size:14px; flex-shrink:0; margin-top:2px; }
  .task-info h4 { font-size:12px; font-weight:700; color:var(--text); }
  .task-info p  { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.45; }
  .task-id { font-size:9px; color:rgba(109,143,163,.5); font-family:Consolas,monospace; }

  /* Couleurs selon statut */
  .task.done    { border-color:#00d4a030; }
  .task.partial { border-color:#f5c84230; }
  .task.todo    { border-color:#1d3a4d; }

  /* ── Badge bloquant (tooltip) ── */
  .task-blocker-badge {
    display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; border-radius:50%;
    background:var(--orange); color:#fff;
    font-size:9px; font-weight:900; font-style:italic;
    vertical-align:middle; margin-left:5px; cursor:help;
    flex-shrink:0; line-height:1;
    border:1.5px solid rgba(255,255,255,.3);
  }
  .task-tooltip {
    display:none; position:absolute;
    bottom:calc(100% + 8px); left:0; right:0;
    background:#0a2533; color:#c8e8f8;
    border:1px solid rgba(30,159,212,.3);
    border-radius:10px; padding:11px 14px;
    font-size:11px; line-height:1.6; z-index:500;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    pointer-events:none;
  }
  .task-tooltip::after {
    content:''; position:absolute; top:100%; left:20px;
    border:7px solid transparent; border-top-color:#0a2533;
  }
  .task-tooltip strong {
    color:var(--accent); font-size:10px; text-transform:uppercase;
    letter-spacing:.5px; display:block; margin-bottom:5px;
  }
  .task:hover .task-tooltip { display:block; }

  /* ── Section prochaines étapes ── */
  .next-steps {
    background:linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    border:1px solid var(--border);
    border-radius:16px; padding:26px 28px;
    margin-top:12px;
  }
  .next-steps h2 {
    font-size:14px; font-weight:800; color:var(--text);
    text-transform:uppercase; letter-spacing:2px; margin-bottom:18px;
  }
  .steps-list { display:flex; flex-direction:column; gap:12px; }
  .step-item {
    display:flex; gap:14px; align-items:flex-start;
    background:rgba(255,255,255,.06);
    border-radius:12px; padding:12px 14px;
    border:1px solid rgba(255,255,255,.08);
  }
  .step-num {
    color:white; font-weight:800; font-size:12px; border-radius:99px;
    min-width:26px; height:26px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0;
    background:rgba(30,159,212,.3);
  }
  .step-content h4 { font-size:13px; font-weight:700; color:white; }
  .step-content p  { font-size:11px; color:rgba(255,255,255,.6); margin-top:2px; line-height:1.5; }
  .step-cmd {
    font-family:Consolas,'Courier New',monospace;
    background:rgba(0,0,0,.35); color:var(--green);
    border-radius:6px; padding:5px 10px; font-size:11px;
    margin-top:5px; display:block; word-break:break-all;
  }
</style>

/* ──────────────────────────────────────────────────────────────
   HELPERS — couleurs et icônes selon statut
────────────────────────────────────────────────────────────── */
function statusColor(s) {
  return s === "done"    ? "#00d4a0"
       : s === "partial" ? "#f5c842"
       : /* todo */        "#1d3a4d";
}
function statusBg(s) {
  return s === "done"    ? "rgba(0,212,160,.12)"
       : s === "partial" ? "rgba(245,200,66,.12)"
       : /* todo */        "rgba(29,58,77,.5)";
}
function pillStyle(s) {
  const clr = statusColor(s);
  return `background:${statusBg(s)};color:${clr};`;
}
function pillLabel(s, pct) {
  return s === "done"    ? `✅ DONE — ${pct}%`
       : s === "partial" ? `⚠️ EN COURS — ${pct}%`
       : `⏳ À VENIR — ${pct}%`;
}
function taskIcon(s) {
  return s === "done" ? "✅" : s === "partial" ? "⚠️" : "⏳";
}
function taskBg(s) {
  return s === "done"    ? "rgba(0,212,160,.07)"
       : s === "partial" ? "rgba(245,200,66,.07)"
       : "";
}

/* ──────────────────────────────────────────────────────────────
   RENDU DES PHASES
────────────────────────────────────────────────────────────── */
function renderPhases() {
  const container = document.getElementById("phases-container");
  let html = "";

  ROADMAP.phases.forEach(phase => {
    const borderColor = statusColor(phase.status);
    const miniBarColor = borderColor;
    const miniBarWidth = phase.progress;

    let tasksHtml = "";
    phase.tasks.forEach(task => {
      const icon   = taskIcon(task.status);
      const bg     = taskBg(task.status);
      const border = statusColor(task.status);
      const tooltipHtml = task.blocker
        ? `<span class="task-blocker-badge" title="">!</span>
           <div class="task-tooltip">
             <strong>⚠ Point de vigilance</strong>${task.blocker}
           </div>`
        : "";
      tasksHtml += `
        <div class="task ${task.status}" style="${bg ? 'background:' + bg + ';' : ''}border-color:${border}30;">
          <div class="task-icon">${icon}</div>
          <div class="task-info" style="flex:1;">
            <h4>${task.name}${tooltipHtml}</h4>
            <p>${task.note}</p>
            <span class="task-id">${task.id}</span>
          </div>
        </div>`;
    });

    html += `
      <div class="phase-card" id="${phase.id}">
        <div class="phase-header" style="border-left:5px solid ${borderColor};" onclick="toggle('${phase.id}')">
          <div class="phase-icon">${phase.icon}</div>
          <div class="phase-meta">
            <h3>${phase.title}</h3>
            <p>${phase.subtitle}</p>
          </div>
          <div class="phase-mini-bar">
            <div style="height:100%;width:${miniBarWidth}%;background:${miniBarColor};border-radius:99px;transition:width .6s;"></div>
          </div>
          <div class="status-pill" style="${pillStyle(phase.status)}">${pillLabel(phase.status, phase.progress)}</div>
          <div class="chevron">▾</div>
        </div>
        <div class="phase-body">
          <div class="tasks-grid">${tasksHtml}</div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

/* ──────────────────────────────────────────────────────────────
   RENDU DES PROCHAINES ÉTAPES
────────────────────────────────────────────────────────────── */
function renderNextSteps() {
  const container = document.getElementById("next-steps-container");
  let html = "";
  ROADMAP.next_steps.forEach(step => {
    const numBg = step.status === "next"
      ? "background:rgba(30,159,212,.4);"
      : "background:rgba(109,143,163,.2);";
    html += `
      <div class="step-item">
        <div class="step-num" style="${numBg}">${step.num}</div>
        <div class="step-content">
          <h4>${step.title}</h4>
          <p>${step.detail}</p>
          <code class="step-cmd">${step.cmd}</code>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

/* ──────────────────────────────────────────────────────────────
   CALCUL DES STATS GLOBALES
────────────────────────────────────────────────────────────── */
function renderStats() {
  let done = 0, partial = 0, todo = 0;
  ROADMAP.phases.forEach(p => p.tasks.forEach(t => {
    if      (t.status === "done")    done++;
    else if (t.status === "partial") partial++;
    else                             todo++;
  }));
  const total = done + partial + todo;
  const pct   = ROADMAP.global_progress;

  document.getElementById("global-bar").style.width = pct + "%";
  document.getElementById("global-pct").textContent  = pct + "%";
  document.getElementById("cnt-done").textContent    = done;
  document.getElementById("cnt-partial").textContent = partial;
  document.getElementById("cnt-todo").textContent    = todo;
  document.getElementById("cnt-total").textContent   = total;
  document.getElementById("last-updated").textContent = "Dernière mise à jour : " + ROADMAP.last_updated;
}

/* ──────────────────────────────────────────────────────────────
   INTERACTIONS — ouvrir / fermer les phases
────────────────────────────────────────────────────────────── */
function toggle(id) {
  document.getElementById(id).classList.toggle("open");
}

let allOpen = false;
function toggleAll() {
  allOpen = !allOpen;
  document.querySelectorAll(".phase-card").forEach(card => {
    allOpen ? card.classList.add("open") : card.classList.remove("open");
  });
}

/* ──────────────────────────────────────────────────────────────
   INITIALISATION — ouvrir la première phase par défaut
────────────────────────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", () => {
  renderPhases();
  renderNextSteps();
  renderStats();
  // Ouvrir la dernière phase incomplète par défaut
  const lastIncomplete = [...ROADMAP.phases].reverse().find(p => p.status !== "done");
  if (lastIncomplete) {
    const card = document.getElementById(lastIncomplete.id);
    if (card) card.classList.add("open");
  }
});
</script>
